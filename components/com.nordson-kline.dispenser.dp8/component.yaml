ocm_version: '1.1'
id: com.nordson-kline.dispenser.dp8
revision: 1.0.0
kind: dispenser
source:
  kind: datasheet
  ref: Nordson-Kline DP-8 Precision Dot Dispenser datasheet
geometry:
  units: kg
  mass: 4.2
  envelope:
    length: 120.0
    width: 160.0
    height: 210.0
    units: mm
name: Nordson-Kline DP-8 Precision Dot Dispenser
pneumatic:
  port: G1/8
  pressure_max: 6
  pressure_min: 4
  pressure_units: bar
vendor: Nordson-Kline
comms:
  protocol: ethercat
  device_description: ESI file available from vendor
  signals:
  - name: volume_actual
    direction_device: output
    type: real
    unit: uL
    note: Per-shot actual dispensed volume.
  - name: pressure_fault
    direction_device: output
    type: bool
    note: Needle-pressure fault flag, reported per shot.
  - name: reservoir_low
    direction_device: output
    type: bool
    electrical: PNP
    note: 'Reservoir low sensor: discrete PNP output.'
notes: 'Fixed-mount benchtop unit: bolts to the machine table, NOT robot-carried. Dispenses UV-cure adhesive dots 0.3-2.5 uL via a jetting valve. Requires a heated reservoir at 35-45 C, ready ~4 min after power-on. If idle >8 min with the reservoir hot, a purge shot is required before the next dispense to clear the needle. CAUTION: needle tip reaches 45 C; jetting produces a fine aerosol -- vendor requires local extraction and interlocked access.'
electrical:
  supplies:
  - rail: 24VDC
    current_peak_a: 3.5
    note: heater supply
hazards:
- burn_hot
- aerosol
