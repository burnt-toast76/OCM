notes: 'Media Type: Liquid and gases. Pressure Range: -5 to +100.4 inches of water column. Accuracy: ±0.5% of full range. Sensing Element Material: Ceramic. Seal Material: FKM. Wetted Parts: Ceramic, FKM, 316 stainless steel. Output 2: switch (N.O./N.C.), PNP/NPN selectable OR 4-20 mA / 0-10 VDC (selectable mode, single datasheet type not stated). Display Type: 4-digit, two-color LED display. Operating Voltage: 18-30 VDC. Process Connection: 1/4in male NPT. Electrical Connection: 4-pin M12 quick-disconnect. Additional Information: Purchase cable separately. Agency Approvals: UL Listed File # E320431; UL Recognized File # None; UL Hazardous File # None; CSA File # None; RoHS Status Yes (See CE Doc). CE declarations and EU REACH document available via linked documents on vendor site.'
