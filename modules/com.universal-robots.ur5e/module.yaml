# ─────────────────────────────────────────────────────────────────────
# OCM Module Definition — Universal Robots UR5e, 6-axis collaborative arm
#
# urdf_fragment / meshes/collision are vendored from Universal Robots'
# own Universal_Robots_ROS2_Description (BSD-3-Clause), flattened from
# the real vendored kinematics/inertials -- not hand-estimated like the
# box-primitive stubs elsewhere in modules/. See NOTICE.md for the exact
# source, license text, and what was (collision geometry, kinematics,
# inertials) and wasn't (visual DAE meshes, ros2_control tags) carried
# over, and urdf/generate_flat_urdf.py for how it was derived.
#
# Proprietary vendor hardware: `license` below is NOT CERN-OHL-S-2.0 (that
# would misrepresent someone else's closed design). It only applies to
# Accel Solutions' own open modules (sd50, dh200, frame1200, ...). The
# vendored URDF/mesh subtree carries its own BSD-3-Clause license
# (NOTICE.md), independent of this manifest's `license:` field below.
# ─────────────────────────────────────────────────────────────────────
ocm_version: "1.0"
id: com.universal-robots.ur5e
revision: "3.1.0"
name: "UR5e"
vendor: "Universal Robots A/S"
license: LicenseRef-Proprietary
kind: robot
description: >
  6-axis collaborative arm. 5 kg payload, 850 mm reach. Programmed over
  URScript, a raw TCP socket (port 30002) -- see cell.yaml's `address.ip`.
  That motion channel is separate from `comms` below, which is the UR
  controller's Modbus TCP register interface, used here only to carry
  PackML status/command so the cell coordinator's logic stays generic.

mechanical:
  mount:
    interface: ocm-base-grid-50
    footprint_mm: [190, 190]        # base flange envelope

  frames:
    origin:
      xyz_mm: [0, 0, 0]
      note: "Base mounting face. Per-instance placement comes from cell.yaml's mount.pose."

  geometry:
    collision: meshes/collision/base.stl        # representative single mesh; urdf_fragment carries the real per-link set
    urdf_fragment: urdf/ur5e.urdf.xacro         # vendored + flattened from Universal_Robots_ROS2_Description -- see NOTICE.md

  mass_kg: 20.6

comms:
  # UR e-Series RTDE, TCP :30004 — the robot's built-in channel. Zero coordination
  # wiring; safety stays hardwired per spec/06 and is NOT on this channel.
  protocol: ur-rtde
  signals:
    # spec/08 handshake contract. offset = RTDE general-purpose int register index.
    # Direction is from the COORDINATOR's point of view (schema convention):
    #   the robot WRITES at_step/heartbeat -> coordinator reads them -> 'input'.
  - {name: hs_at_step, direction: input, type: int32, offset: 0, role: handshake_at_step}
  - {name: hs_heartbeat, direction: input, type: int32, offset: 1, role: handshake_heartbeat}
  - {name: hs_done_step, direction: output, type: int32, offset: 0, role: handshake_done_step}
  - {name: hs_abort, direction: output, type: int32, offset: 1, role: handshake_abort}

state_machine:
  model: packml
  implements:
  - idle
  - starting
  - execute
  - completing
  - complete
  - resetting
  - aborting
  - aborted
  - clearing
  - stopping
  - stopped
  # Protective stop decelerates the arm without damaging it or (typically)
  # a held part. Whether that's actually safe for a GIVEN op is the
  # capability's own abort_safe concern (e.g. sd50's drive_screw is not).
  abort_safe: true

safety:
  hazards: [pinch, crush]
  required_performance_level: PLd
  sto_required: true
  guarding: interlocked
  safe_state: "Category 0/1 stop per configured safety I/O; joints hold position under brake."
