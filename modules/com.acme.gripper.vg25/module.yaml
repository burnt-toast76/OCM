ocm_version: '1.1'
id: com.acme.gripper.vg25
revision: 1.0.0
name: Acme VG-25 Vacuum Gripper
vendor: Acme
license: CERN-OHL-S-2.0
kind: end_effector
description: "Integrated venturi vacuum gripper with a PNP part-present switch and\
  \ a blow-off assist. Pick force is set by supply-pressure regulation over the Acme\
  \ ASL serial link. No moving jaws \u2014 it grips a flat, sealable face."
mechanical:
  mount:
    interface: iso-9409-1-a50
    footprint_mm:
    - 45.0
    - 45.0
  frames:
    origin:
      xyz_mm:
      - 0.0
      - 0.0
      - 0.0
      note: Robot tool flange face. Everything below is relative to this.
    tcp:
      xyz_mm:
      - 0.0
      - 0.0
      - 80.0
      rpy_deg:
      - 0.0
      - 0.0
      - 0.0
      note: Suction-cup sealing face. +Z points away from flange, i.e. INTO the part.
  mass_kg: 0.65
  com_mm:
  - 0.0
  - 0.0
  - 33.0
  geometry:
    urdf_fragment: urdf/generated_box.urdf.xacro
    collision: urdf/generated_box.urdf.xacro
electrical:
  supplies:
  - rail: 24VDC
    current_nominal_a: 0.8
  pneumatic:
    pressure_bar: 6.0
    port: G1/8
  connectors:
  - ref: X1
    type: M12-A-5P
    carries: power+fieldbus
comms:
  protocol: x-acme-asl
  signals:
  - name: packml_cmd
    direction: output
    type: uint16
    role: packml_cmd
  - name: packml_state
    direction: input
    type: uint16
    role: packml_state
  - name: fault_code
    direction: input
    type: uint16
    role: fault_code
  - name: heartbeat
    direction: input
    type: bool
    role: heartbeat
  - name: target_force
    direction: output
    type: real
    unit: N
    role: process_param
  - name: blow_off
    direction: output
    type: bool
  - name: part_present
    direction: input
    type: bool
    role: process_result
capabilities:
- name: grip
  summary: Draw vacuum and confirm the part is on the cup via the vacuum switch.
  parameters:
    force_n:
      type: number
      unit: N
      min: 10.0
      max: 120.0
      summary: "Pick force, realized via supply-pressure/vacuum regulation. Hard datasheet\
        \ limits \u2014 the generator rejects anything outside."
  motion:
    frame: tcp
    approach_vec:
    - 0
    - 0
    - 1
    approach_mm: 20.0
    approach_speed_mm_s: 40.0
    retract_vec:
    - 0
    - 0
    - -1
    retract_mm: 30.0
    clearance_mm: 3.0
    hold_still: true
  preconditions:
  - part_present == false
  postconditions:
  - part_present == true
  results:
    gripped:
      type: boolean
  nominal_duration_s: 0.5
- name: release
  summary: Vent the cup to atmosphere and set the part down.
  motion:
    frame: tcp
    approach_vec:
    - 0
    - 0
    - 1
    approach_mm: 15.0
    approach_speed_mm_s: 40.0
    retract_vec:
    - 0
    - 0
    - -1
    retract_mm: 30.0
    clearance_mm: 3.0
    hold_still: true
  preconditions:
  - part_present == true
  postconditions:
  - part_present == false
  nominal_duration_s: 0.3
- name: blow_off
  summary: Positive air pulse to shed a part that clings to the cup after venting.
    Recovery op.
  preconditions:
  - part_present == true
  postconditions:
  - part_present == false
  nominal_duration_s: 0.4
state_machine:
  model: packml
  implements:
  - idle
  - starting
  - execute
  - completing
  - complete
  - resetting
  - aborting
  - aborted
  - clearing
  - stopping
  - stopped
  abort_safe: false
safety:
  hazards:
  - pressure
  - noise
  required_performance_level: PLc
  sto_required: false
  guarding: interlocked
  safe_state: "On loss of air or control power the venturi stops and vacuum decays;\
    \ a held part is released and will drop. This gripper is NOT fail-hold \u2014\
    \ the cell coordinator must not rely on grip retention through a power/air loss."
maintenance:
  wear_items:
  - name: Suction cup
    part_number: VG25-CUP
    interval_cycles: 100000
  - name: Ejector filter
    part_number: VG25-FLT
    interval_hours: 500
