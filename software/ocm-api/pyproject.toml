[project]
name = "ocm-api"
version = "0.1.0"
description = "The one programmatic surface (ADR-0012, spec/09-ocm-api.md): a library layer over ocm-core/ocm-resolve/ocm-generator, an MCP server, and a FastAPI HTTP wrapper -- three thin clients of the same refusal engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "PyYAML>=6.0",
    "ruamel.yaml>=0.18",
    "jsonschema>=4.18",
    "jsonpatch>=1.33",
    # Upper bound is load-bearing: mcp 2.0.0 removed mcp.server.fastmcp
    # (FastMCP -> MCPServer in mcp.server.mcpserver). Migrating is its own
    # task; until then an unbounded >= silently breaks CI on upstream release.
    "mcp>=1.2.0,<2",
    "fastapi>=0.110",
    # /agent/chat's Anthropic Messages API tool-use loop. Always a real
    # dependency -- the degraded case is a missing ANTHROPIC_API_KEY
    # (AGENT_UNAVAILABLE), not a missing package.
    "anthropic>=0.40",
]

[project.optional-dependencies]
# The HTTP wrapper needs a real ASGI server to actually serve traffic;
# FastAPI's TestClient (used by the test suite) only needs `httpx`, not
# uvicorn itself -- see test dependency below.
serve = ["uvicorn[standard]>=0.29"]
# ocm-core/ocm-resolve/ocm-generator are sibling packages in this
# monorepo, not published to an index -- install all editable from the
# same venv:
# `pip install -e ../ocm-core -e ../ocm-resolve -e ../ocm-generator -e ".[test,tesseract]"`
# `plan_cell`/`check_collision`'s happy path needs ocm-generator's own
# `tesseract` extra; everything else in this package works without it.
tesseract = ["ocm-generator[tesseract]"]
# STEP->GLB conversion for component attachments (spec/09 "Agent
# orchestrator") is best-effort and gracefully degrades if unavailable --
# cascadio's Windows wheel availability was uncertain at the time this was
# written, so this stays a separate extra rather than a hard dependency of
# the whole package; ocm_api.attachments handles ImportError itself.
cad = ["cascadio>=0.0.10", "trimesh>=4.0"]
# numpy is test-only, not a runtime dependency of attachments.py itself --
# tests/test_attachments.py's fakes construct real numpy arrays for
# `.bounds` (trimesh's own real return shape: a (2, 3) array supporting
# elementwise subtraction + .tolist()) so they exercise _measure_glb's
# actual numpy-array usage, not a hand-rolled stand-in that could silently
# diverge from what trimesh really returns.
test = ["pytest>=8.0", "httpx>=0.27", "numpy>=1.24"]

[project.scripts]
ocm-api-mcp = "ocm_api.mcp_server:main"
ocm-api-http = "ocm_api.http_app:main"

[tool.setuptools.packages.find]
include = ["ocm_api*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
