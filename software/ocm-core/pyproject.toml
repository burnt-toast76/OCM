[project]
name = "ocm-core"
version = "0.1.0"
description = "Load and validate OCM module manifests and cell compositions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.18",
    # ocm_core.yaml_rt.new_yaml_rt -- the one canonical round-trip config
    # every manifest writer shares (ocm_api.workspace.write_yaml, `ocm
    # fmt`). Small and pure-Python, unlike the genuinely optional
    # tesseract-robotics/cascadio extras elsewhere in this monorepo -- a
    # real, always-installable dependency, not one that should degrade.
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["ocm_core*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
