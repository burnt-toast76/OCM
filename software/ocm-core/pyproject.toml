[project]
name = "ocm-core"
version = "0.1.0"
description = "Load and validate OCM module manifests and cell compositions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["ocm_core*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
