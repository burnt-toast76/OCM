ocm_version: '1.0'
kind: cell
id: com.accelsolutions.cell.bracket-asm-01
name: Bracket Assembly Cell 01
license: CERN-OHL-S-2.0
base:
  module: com.accelsolutions.base.frame1200@2.0.0
  datum: cell_origin
  grid: ocm-base-grid-50
modules:
- instance: robot1
  module: com.universal-robots.ur5e@3.1.0
  mount:
    station:
    - 400
    - 300
    pose:
      xyz_mm:
      - 400
      - 300
      - 0
      rpy_deg:
      - 0
      - 0
      - 0
  address:
    ip: 192.168.1.10
  tool: sd1
  joint_state:
    shoulder_lift_joint: -1.5707963267948966
    elbow_joint: 1.5707963267948966
- instance: feed1
  module: com.accelsolutions.screwfeeder.sf20@1.0.0
  mount:
    pose:
      xyz_mm:
      - 180
      - 640
      - 0
      rpy_deg:
      - 0
      - 0
      - 0
  address:
    ethercat_position: 5
- instance: nest1
  module: com.accelsolutions.fixture.pneumatic-nest@1.1.0
  mount:
    pose:
      xyz_mm:
      - 640
      - 300
      - 0
      rpy_deg:
      - 0
      - 0
      - 90
  address:
    ethercat_position: 6
- instance: cam1
  module: com.lmi.gocator.2350@1.0.0
  mount:
    pose:
      xyz_mm:
      - 625
      - 250
      - 600
      rpy_deg:
      - 180
      - 0
      - 0
  address:
    ip: 192.168.1.20
  calibration: cal/cam1_2026-07-01.yaml
- instance: sd1
  module: com.accelsolutions.screwdriver.sd50@1.2.0
  mount:
    on: robot1.flange
  requires:
    workpiece_secured: nest1.clamped
controller:
  runtime: beremiz
  target: revpi-connect-5
  fieldbus: ethercat
  tags: generated
safety:
  circuit: safety/bracket-cell-01.pdf
  relay: Pilz PNOZ s4
  performance_level: PLd
  verified_by: "(human signature required — the tool will not sign this)"
part:
  id: BRK-4471
  cad: cad/BRK-4471.step
  features:
    hole_1:
      xyz_mm:
      - 12
      - 12
      - 0
      normal:
      - 0
      - 0
      - 1
    hole_2:
      xyz_mm:
      - 12
      - 88
      - 0
      normal:
      - 0
      - 0
      - 1
    hole_3:
      xyz_mm:
      - 64
      - 50
      - 0
      normal:
      - 0
      - 0
      - 1
plan:
- step: clamp
  module: nest1
  op: clamp
  params:
    force_n: 120
- step: fasten
  for_each:
  - hole_1
  - hole_2
  - hole_3
  sequence:
  - module: sd1
    op: load_screw
  - module: sd1
    op: drive_screw
    at: part.features.${item}
    params:
      torque_nm: 2.4
      depth_mm: 8.0
- step: release
  module: nest1
  op: unclamp
