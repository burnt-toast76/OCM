name: test

# pytest across all four Python packages, alongside the existing fmt-check
# workflow. Each job installs only that package's own `test` extra plus
# whatever sibling packages it structurally needs to even import (see each
# pyproject.toml's own comment on this) -- NOT the heavier, genuinely
# optional runtime extras (`tesseract` -> tesseract-robotics for
# --collision/plan; `cad` -> cascadio/trimesh for STEP->GLB conversion).
# Those degrade gracefully by design: every test that needs
# tesseract_robotics already calls pytest.importorskip("tesseract_robotics")
# at module level, and attachments.py's cascadio/trimesh usage is guarded
# (`cascadio is None or trimesh is None`) with tests that exercise both the
# present and absent case via monkeypatch regardless of what's actually
# installed. So a suite lacking one of these extras SKIPS the tests that
# need it, with a clear reason (`-ra` surfaces the reason in the log), it
# doesn't fail or error at collection.
#
# Every `pip install` passes `-c ci/requirements.txt` -- the CI dependency lock.
# The editable ocm-* packages still install from the working tree; their
# third-party dependencies resolve to the pinned versions in that file, so an
# upstream release can't silently break a build no commit here touched (mcp
# 2.0.0 did exactly that). See ci/requirements.txt and .github/dependabot.yml.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ocm-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -c ci/requirements.txt -e "software/ocm-core[test]"
      - run: pytest -ra software/ocm-core/tests

  ocm-resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ocm-core (sibling), ocm-resolve[test]
        run: |
          pip install -c ci/requirements.txt -e software/ocm-core
          pip install -c ci/requirements.txt -e "software/ocm-resolve[test]"
      - run: pytest -ra software/ocm-resolve/tests

  ocm-generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # No `tesseract` extra: every --collision/plan-dependent test file
      # already does `pytest.importorskip("tesseract_robotics")` at module
      # level, so this job just skips them instead of installing a heavy
      # compiled robotics dependency to run them. No ocm-api needed at all
      # -- `ocm fmt` (test_cli_fmt.py) calls ocm_core.new_yaml_rt directly,
      # not ocm_api.workspace, so its tests run for real here rather than
      # skipping.
      - name: Install ocm-core, ocm-resolve (siblings), ocm-generator[test]
        run: |
          pip install -c ci/requirements.txt -e software/ocm-core
          pip install -c ci/requirements.txt -e software/ocm-resolve
          pip install -c ci/requirements.txt -e "software/ocm-generator[test]"
      - run: pytest -ra software/ocm-generator/tests

  ocm-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # ocm-generator is a structural dependency here (ocm_api/composition.py,
      # discovery.py, and generation.py import from it at module level), not
      # an optional extra -- but its OWN `tesseract` extra stays uninstalled
      # for the same reason as the ocm-generator job: every test that needs
      # it already importorskips tesseract_robotics. No `cad` extra either
      # -- attachments.py's cascadio/trimesh usage is guarded and every test
      # that cares about a specific outcome monkeypatches its own fakes in,
      # regardless of what's actually installed.
      - name: Install ocm-core, ocm-resolve, ocm-generator (siblings), ocm-api[test]
        run: |
          pip install -c ci/requirements.txt -e software/ocm-core
          pip install -c ci/requirements.txt -e software/ocm-resolve
          pip install -c ci/requirements.txt -e software/ocm-generator
          pip install -c ci/requirements.txt -e "software/ocm-api[test]"
      - run: pytest -ra software/ocm-api/tests

  ocm-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # ocm-api is the structural dependency (ADR-0016: the serving layer
      # reads through it), which pulls the same sibling chain as the
      # ocm-api job. The golden evals run against the committed claims/
      # registry in this checkout -- that is the point of them.
      - name: Install ocm-core, ocm-resolve, ocm-generator, ocm-api (siblings), ocm-mcp[test]
        run: |
          pip install -c ci/requirements.txt -e software/ocm-core
          pip install -c ci/requirements.txt -e software/ocm-resolve
          pip install -c ci/requirements.txt -e software/ocm-generator
          pip install -c ci/requirements.txt -e software/ocm-api
          pip install -c ci/requirements.txt -e "software/ocm-mcp[test]"
      - run: pytest -ra software/ocm-mcp/tests
