name: fmt-check

# `ocm fmt --check` (software/ocm-generator/ocm_generator/cli.py) fails if
# any modules/*/module.yaml, components/*/component.yaml, or
# cells/*/cell.yaml isn't already byte-identical to what
# ocm_core.new_yaml_rt() would round-trip it to -- the same ruamel config
# ocm_api.workspace.write_yaml (the GUI/agent write path) uses. Catches a
# manifest that was hand-edited (or generated some other way) with
# formatting the write path would silently reflow on its very next save.
#
# Only ocm-core and ocm-generator, deliberately -- `ocm fmt` calls
# ocm_core.new_yaml_rt directly (ocm-core is the dependency floor: no
# sibling-package imports at all), so it needs neither ocm-api
# (fastapi/anthropic/mcp) nor ocm-resolve/ocm_generator.scene just to
# format YAML. Verified in a venv with only these two installed.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fmt-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ocm-core, ocm-generator
        run: |
          pip install -e software/ocm-core
          pip install -e software/ocm-generator

      - run: ocm fmt --check
