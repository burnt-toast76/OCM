# OCM claims vocabulary 1.0 (seed draft)
#
# Governed by ADR-0035. Every entry defines a claim key: its value shape, unit
# dimension, and a definition precise enough to judge whether two manufacturers'
# datasheets answer the same question. Keys are seeded by demand — fields the
# component schema and existing component manifests already consume — not by
# what datasheets happen to print.
#
# Value shapes:
#   scalar      one number + unit
#   spread      any subset of min/typ/max the document states, plus `unqualified`
#               for a single number printed with no qualifier; + unit. At least
#               one bound present. A bare number is never a valid spread.
#   dimensions  length/width/height + unit
#   text        verbatim string
#   list        list of text
#   record      structured object; schema fragment named in the entry
# Shapes enter this set the way keys do — by demand, never speculatively.
#
# Subject: a key marked `subject: takes` claims about one element among
# several (a connector, port, output, interface, process element); the claim's
# subject is that element's designation, verbatim as printed. When the document
# designates no element (a sole unlabeled connector), the subject is omitted —
# the absence is the transcription. Keys without the marker take no subject.
# A condition says when a value holds; a subject says which thing it is about.
#
# Promotion: an x- key enters this file via pull request, with aliases naming
# the x- key it absorbs (ADR-0035 D3). Ingested claim records are never
# rewritten. Alias binding is SHAPE-GATED: a record stored under the alias
# spelling binds to the promoted key only when its value fits the entry's
# shape; an incompatible record (a packed text blob under a spread key)
# remains unbound and warned, untouched -- the strict alternative would
# permanently bar promotion of any key that ever carried one packed record,
# since the store is append-only. Both spellings resolve in queries; served
# records keep their stored key and carry bound_via naming the promoted key.
#
# Versioning: the filename carries the FORMAT major (like the schema files);
# `ocm_version` below is the KEY-SET version that attestations pin (ADR-0035
# D4). Adding a key bumps it -- an older attestation honestly does not cover
# the new keys, and a document gains coverage through a new pass and a new
# attestation, never by editing the old one. Each entry's `since:` records
# the version that introduced its key (absent means '1.0'); that is what
# lets a served absence distinguish "attested silence" from "key newer than
# the attestation" (ADR-0036 D3).

ocm_version: '1.3'
keys:

  # --- identity -------------------------------------------------------------
  # Promoted at 1.3 from the two machine-readable sources (ADR-0038 D8, by the
  # ordinary ADR-0035 D3 route: two documents, two manufacturers, two formats).
  # Every document states these; a datasheet prints them on the front page and
  # a device description states them as fields. The protocol-issued identifiers
  # from the same documents -- vendor id, product code, device revision -- are
  # deliberately NOT here; see ADR-0038 D7.

  - key: vendor_name
    since: '1.3'
    aliases: [x-vendor_name]
    shape: text
    dimension: none
    definition: >
      Manufacturer or vendor name as the document states it, verbatim. This is
      a transcription of a stated field and is not the document record's
      `manufacturer`, which is descriptive provenance and correctable
      (ADR-0038 D3): a manifest sources component.vendor from this claim, which
      cites where the document says it, never from that metadata. Where a
      document names a manufacturer and a separate distributor or brand, each
      is its own claim, distinguished in conditions as the document labels it.
    demand: [component.vendor, 'ifm AL1326 EDS "[Device], VendName"', 'Beckhoff ELX ESI "Vendor/Name"']

  - key: product_name
    since: '1.3'
    aliases: [x-product_name]
    shape: text
    dimension: none
    definition: >
      The device's descriptive product name as the document states it,
      verbatim -- what the device is called, not what is ordered, which is
      `catalog_number`. Printed spacing and punctuation are kept as printed.
      Where a document prints the name in more than one language, each is a
      separate claim and the language identifier goes in conditions exactly as
      the document states it; choosing one language is an editorial act
      transcription does not permit (ADR-0014).
    demand: [component.name, 'ifm AL1326 EDS "[Device], ProdName"', 'Beckhoff ELX ESI "Name[@LcId]", both languages']

  - key: catalog_number
    since: '1.3'
    aliases: [x-catalog_number]
    shape: text
    dimension: none
    definition: >
      The orderable part designation the document prints for the device
      ("Catalog" in an EDS, "Type" in an ESI, "Model No." on many datasheets),
      verbatim. Its value commonly equals the claim's own `applies_to` entry
      and is not redundant with it: `applies_to` is the transcriber's statement
      of which parts a claim covers, while this key is the document's own
      statement, at a citable position, that the part is designated so. A
      document that states an ordering scheme rather than one designation
      (a base with option suffixes) states it in whatever form it prints; this
      key never assembles one.
    demand: [component.part_number, 'ifm AL1326 EDS "[Device], Catalog"', 'Beckhoff ELX ESI "Device Type"']

  # --- electrical -----------------------------------------------------------

  - key: supply_voltage
    shape: spread
    dimension: voltage
    definition: >
      DC or AC supply voltage range at the device's power input under which the
      manufacturer specifies normal operation. Not the absolute-maximum rating.
    demand: [component.electrical.supplies, eps25 notes "Operating Voltage 18-30 VDC"]

  - key: current_nominal
    shape: scalar
    dimension: current
    definition: >
      Steady-state supply current draw at rated supply voltage, excluding
      switched loads the device powers.
    demand: ["component.electrical.supplies[].current_nominal_a"]

  - key: current_peak
    shape: scalar
    dimension: current
    definition: >
      Maximum transient supply current the manufacturer states (inrush,
      actuation peak). Duration goes in conditions.
    demand: ["component.electrical.supplies[].current_peak_a"]

  - key: power_consumption
    shape: spread
    dimension: power
    definition: Input power at rated supply voltage.
    demand: [component.electrical]

  - key: connector_pinout
    shape: record
    record_schema: pinout   # pin, function, wire_color per component schema
    subject: takes
    dimension: none
    definition: >
      Pin-to-function assignment of one named connector, as printed in the
      wiring section. One claim per connector; the connector designation is
      the claim's subject.
    demand: ["component.electrical.connectors[].pins", eps25 M12 pinout]

  - key: output_voltage
    since: '1.1'
    shape: spread
    subject: takes
    dimension: voltage
    definition: >
      Voltage rating of a named electrical output (e.g. an open-collector
      maximum). One claim per output; the output designation, where the
      document prints one, is the claim's subject. Load or configuration
      goes in conditions.
    demand: ['fs-n41n "Control output: Open-collector, 30 V or less"']

  - key: output_current
    since: '1.1'
    shape: spread
    subject: takes
    dimension: current
    definition: >
      Current rating of a named electrical output. One claim per stated
      configuration (per output, total across outputs, as an expansion
      unit) -- the configuration goes in conditions; the output
      designation, where printed, is the claim's subject.
    demand: ['fs-n41n "100 mA or less per output / 20 mA or less (expansion unit)"']

  - key: residual_voltage
    since: '1.1'
    shape: spread
    subject: takes
    dimension: voltage
    definition: >
      Residual (saturation) voltage across a named output in the ON state.
      The output current at which it holds goes in conditions.
    demand: ['fs-n41n "Residual voltage: 1.4 V or less (output current: 10 mA or less)"']

  # --- environment and construction ----------------------------------------

  - key: cable_length
    since: '1.2'
    aliases: [x-cable_length]
    shape: spread
    dimension: length
    definition: >
      Length of the device's attached or specified cable, as stated. The
      cable designation or ordering option, where printed, goes in
      conditions.
    demand: ['lr-x catalog "Cable length" rows (single document; admitted by standing call)']

  - key: case_material
    since: '1.2'
    aliases: [x-case_material]
    shape: text
    dimension: none
    definition: >
      Case or housing material designation as printed, verbatim (e.g.
      "Main unit and cover: polycarbonate"). The housing element named in
      the printed cell stays in the value, as printed.
    demand: [fs-n41n datasheet, fs-n40 catalog, 'lr-x catalog "Case material"']

  - key: operating_temp
    shape: spread
    dimension: temperature
    definition: Ambient temperature range for specified operation.
    demand: [component manifests generally]

  - key: ip_rating
    shape: text
    dimension: none
    definition: Ingress protection rating per IEC 60529, verbatim (e.g. IP67).
    demand: [component manifests generally]

  - key: mass
    shape: scalar
    dimension: mass
    definition: Mass of the device as shipped, excluding cables and accessories.
    demand: [component.geometry.mass]

  - key: envelope
    shape: dimensions
    dimension: length
    definition: >
      Overall bounding dimensions of the device body, excluding connectors and
      moving-element travel unless the document includes them (state which in
      conditions).
    demand: [component.geometry.envelope]

  - key: wetted_materials
    shape: list
    dimension: none
    definition: Materials in contact with the process medium.
    demand: [eps25 notes "Wetted Parts"]

  - key: seal_material
    shape: text
    dimension: none
    definition: Primary seal material designation as printed (e.g. FKM).
    demand: [eps25 notes "Seal Material"]

  - key: agency_approvals
    shape: list
    dimension: none
    definition: >
      Certifications and listings as printed, one list item per agency mark,
      including file numbers where given.
    demand: [eps25 notes "Agency Approvals"]

  # --- measurement (sensor-kind components) ---------------------------------

  - key: measuring_range
    shape: spread
    dimension: declared   # unit as printed; never converted at the claims layer
    definition: >
      Span of the measured quantity over which the device meets its accuracy
      specification. Unit is recorded exactly as printed.
    demand: [eps25 notes "Pressure Range ... verbatim; NOT converted"]

  - key: accuracy
    shape: scalar
    dimension: declared
    definition: >
      Measurement accuracy as stated, in the document's own terms (e.g. percent
      of full range). Reference conditions go in conditions.
    demand: [eps25 notes "Accuracy"]

  - key: repeatability
    shape: scalar
    dimension: declared
    definition: Repeatability as stated, in the document's own terms.
    demand: [sensor components generally]

  - key: detecting_distance
    since: '1.2'
    aliases: [x-detecting_distance]
    shape: spread
    dimension: length
    definition: >
      Detecting distance or sensing range of a detection device, as
      stated, one claim per stated operating/power mode -- the mode, the
      amplifier series assumed, and the standard target go in conditions
      as the source states them. Unit as printed.
    demand: ['fs-n40 catalog fiber tables (per-mode, "when using the FS-N40 Series")', lr-x catalog]

  - key: response_time
    since: '1.2'
    aliases: [x-response_time]
    shape: spread
    dimension: time
    definition: >
      Output response time of the device, as stated, one claim per stated
      operating/power mode -- the mode designation goes in conditions,
      verbatim with any footnote markers. Unit as printed.
    demand: [fs-n41n datasheet, fs-n40 catalog, lr-x catalog per-mode response tables]

  - key: output_configuration
    shape: text
    subject: takes
    dimension: none
    definition: >
      Electrical form of a named output: switching type (PNP/NPN, N.O./N.C.)
      or analog range -- ONLY. Voltage and current ratings belong to
      output_voltage, output_current, and residual_voltage, one statement
      per claim (ADR-0035 D1), never packed into this key's text. One claim
      per output; the output designation is the claim's subject.
    demand: ["eps25 comms.signals[].electrical"]

  # --- pneumatic ------------------------------------------------------------

  - key: operating_pressure
    shape: spread
    dimension: pressure
    definition: Supply or working pressure range for specified operation.
    demand: [component.pneumatic.pressure_min/max]

  - key: flow_rate
    shape: scalar
    dimension: flow
    definition: Rated flow at stated conditions (pressure, medium in conditions).
    demand: [component.pneumatic.flow]

  - key: port_thread
    shape: text
    subject: takes
    dimension: none
    definition: >
      Thread specification of a named port, verbatim (e.g. 1/4in male NPT).
      The port designation is the claim's subject.
    demand: ["component.pneumatic.ports[].thread", eps25]

  # --- comms ----------------------------------------------------------------

  - key: protocol
    shape: text
    subject: takes
    dimension: none
    definition: >
      Communication protocol of a named interface as the document names it
      (e.g. EtherCAT, IO-Link, discrete-io). One claim per interface; the
      interface designation, where the document prints one, is the claim's
      subject.
    demand: [component.comms.protocol]

  # --- process behavior (from dispenser demand) -----------------------------

  - key: warmup_time
    shape: scalar
    dimension: time
    definition: >
      Time from power-on to ready state under stated ambient conditions.
    demand: [dp8 notes "ready ~4 min after power-on"]

  - key: dispense_volume
    shape: spread
    dimension: volume
    definition: Deliverable volume range per actuation.
    demand: [dp8 notes "0.3-2.5 uL"]

  - key: process_temp
    shape: spread
    subject: takes
    dimension: temperature
    definition: >
      Temperature range of a named process element (reservoir, needle, platen)
      required or reached in operation. The element is the claim's subject.
    demand: [dp8 notes "reservoir 35-45 C", "needle tip reaches 45 C"]
