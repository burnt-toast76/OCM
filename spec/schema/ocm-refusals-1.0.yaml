#     layer module. LIVE: emitted by ocm-resolve (derived completeness, units),
#     the generator's collision_geometry checks, and ocm-api's publish gate.
#     The structure-incompleteness row is STRUCTURAL (schema if/then per shape).
OCM_COLLISION_SOURCE_MISSING:
  phase: design
  outcome: refuse
  adr: ADR-0027
  layer: module
  message: "Cannot publish {id}: no mechanical.geometry.collision_source (derived | authored) -- publish requires a collision SOURCE, not a mesh (D6)"
OCM_AUTHORED_COLLISION_MISSING:
  phase: design
  outcome: refuse
  adr: ADR-0027
  layer: module
  message: "{id}: collision_source 'authored' with no collision path, or a path that is not a file"
OCM_COMPONENT_OUTSIDE_COLLISION:
  phase: design
  outcome: refuse
  adr: ADR-0027
  layer: module
  message: "{id}: component {refdes} envelope at its pose protrudes outside the authored collision geometry -- the planner would not know it is there (D2; checked against the mesh's convex hull)"
OCM_DERIVED_POSE_MISSING:
  phase: design
  outcome: refuse
  adr: ADR-0027
  layer: module
  message: "{id}: collision_source 'derived' but component {refdes} has no pose -- the resolver refuses instead of approximating (D5)"
OCM_DERIVED_ENVELOPE_MISSING:
  phase: design
  outcome: refuse
  adr: ADR-0027
  layer: module
  message: "{id}: collision_source 'derived' but component {refdes} ({component_id}) declares no complete geometry.envelope -- datasheet-answerable transcription work (D5)"
OCM_UNIT_UNRECOGNISED:
  phase: design
  outcome: refuse
  adr: ADR-0027
  layer: module
  message: "{id}: unit {unit} is not in ocm_core.units' explicit table (known: {known}) -- never guessed, never normalised"
OCM_LINK_UNKNOWN:
  phase: design
  outcome: refuse
  adr: ADR-0027
  layer: module
  message: "{id}: {what} names link {link}, absent from the urdf_fragment (D4 -- a check, not a mechanism)"
OCM_STRUCTURE_INCOMPLETE:
  phase: design
  outcome: refuse
  adr: ADR-0027
  layer: module
  status: deferred
  requires: "STRUCTURAL -- the module schema's per-shape if/then (box -> size+units, cylinder -> radius+length+units, mesh -> path) rejects an incomplete primitive; surfaces as OCM_SCHEMA_INVALID"
  message: "Structure primitive {id} is missing a dimension or units for its shape"
OCM_ENVELOPE_OVERLAP:
  phase: design
  outcome: advise
  adr: ADR-0027
  layer: module
  # advise, never refuse (D5): real assemblies interpenetrate; overlap is weak
  # evidence of a pose error and strong evidence of nothing. The advisory
  # records the overlapping pair so every flagged placement is identifiable.
  records: envelope_overlap_pair
  message: "{id}: envelopes of {refdes_a} and {refdes_b} overlap at their declared poses -- surfaced, not gated (D5)"

# --- A capability declares the joints it actuates (ADR-0028). All phase
#     design. LIVE: OCM_ACTUATION_CONFLICT + the actuation arm of
#     OCM_UNIT_UNRECOGNISED from ocm-resolve (manifest-only); the fragment-
#     dependent five from the generator's actuation checks through
#     validate_module; OCM_JOINT_STATE_OUT_OF_LIMIT from scene build (the D3
#     retrofit, cell layer). OCM_JOINT_UNACTUATED is advise, never refuse (D4).
OCM_ACTUATION_JOINT_UNKNOWN:
  phase: design
  outcome: refuse
  adr: ADR-0028
  layer: module
  message: "Capability {cap} actuates joint {joint}, absent from this module's urdf_fragment (has: {known})"
OCM_ACTUATION_JOINT_FIXED:
  phase: design
  outcome: refuse
  adr: ADR-0028
  layer: module
  message: "Capability {cap} actuates {joint}, a fixed joint -- no configurable position"
OCM_ACTUATION_UNIT_MISMATCH:
  phase: design
  outcome: refuse
  adr: ADR-0028
  layer: module
  message: "Capability {cap} gives {joint} a {kind} unit {units}; a {joint_type} joint takes {expected}"
OCM_ACTUATION_OUT_OF_LIMIT:
  phase: design
  outcome: refuse
  adr: ADR-0028
  layer: module
  message: "Capability {cap} drives {joint} to {value} {units}, outside its declared limit [{lower}, {upper}] (a revolute joint with no <limit> refuses here too -- malformed URDF, not a silent pass)"
OCM_ACTUATION_CONFLICT:
  phase: design
  outcome: refuse
  adr: ADR-0028
  layer: module
  message: "Capability {cap} actuates {joint} more than once"
OCM_JOINT_STATE_OUT_OF_LIMIT:
  phase: design
  outcome: refuse
  adr: ADR-0028
  layer: cell
  message: "Instance {inst}: joint_state drives {joint} to {value}, outside its declared limit [{lower}, {upper}]"
OCM_JOINT_UNACTUATED:
  phase: design
  outcome: advise
  adr: ADR-0028
  layer: module
  # advise, never refuse (D4): the engine cannot tell a genuinely passive
  # joint from an unfinished manifest, so it says so on the completion list.
  # The advisory records the joint so every flagged fragment is identifiable.
  records: unactuated_joint
  message: "Module {id}: movable joint {joint} is actuated by no capability"
OCM_FRAGMENT_MALFORMED:
  phase: design
  outcome: refuse
  adr: ADR-0028
  layer: module
  # Discovered by ADR-0028 Erratum 1 (a malformed fragment silently disabled
  # every fragment-dependent check at validate time); the underlying principle
  # is ADR-0007's -- urdf_fragment is the load-bearing field, and a claim
  # nothing can parse backs nothing. Emitted by validate_module's fragment-
  # parse step, via the scene's own load_fragment (one parser, one error type).
  message: "mechanical.geometry.urdf_fragment {path} exists but is not well-formed XML: {detail}"
OCM_PLAN_STEP_UNPLANNABLE:
  phase: design
  outcome: refuse
  adr: ADR-0029
  layer: cell
  # D1: every op-step must land on the timeline as motion (at:), an
  # actuation (actuates), or a dwell (nominal_duration_s). A capability
  # that states none of the three has nothing to place -- and the walk
  # says so instead of silently dropping the step from the timeline.
  message: "Plan step {step} calls {inst}.{op}, which declares no at: target, no actuates, and no nominal_duration_s -- nothing to place on a timeline"
OCM_ACTUATION_DURATION_MISSING:
  phase: design
  outcome: refuse
  adr: ADR-0029
  layer: cell
  # The fabrication guard: ADR-0028 D5 assumed nominal_duration_s would be
  # present because every capability in the repo happens to declare it;
  # nothing enforced it. Without this, a timeline would have to invent a
  # duration for a stated motion, and it would render as a cycle time
  # indistinguishable from a measured one.
  message: "Capability {cap} on {module} declares actuates but no nominal_duration_s -- the endpoint is stated, the time is not, and it will not be invented"
OCM_CARRIER_TYPE_HAS_CONTROL:
  phase: design
  outcome: refuse
  adr: ADR-0031
  layer: carrier
  # D1: a carrier has no controller, no states, and no capabilities.
  # additionalProperties:false refuses these structurally, but a carrier
  # authored from a module template carries the keys, and a bare
  # "additional property not allowed" tells the author nothing -- this
  # names the field and says why. A schema satisfied by a stub would be
  # the fabrication ADR-0014 exists to refuse.
  message: "Carrier type {id} declares {field} -- a carrier has no controller, no states, and no capabilities"
OCM_LOCATED_FRAME_UNKNOWN:
  phase: design
  outcome: refuse
  adr: ADR-0031
  layer: module
  message: "located.frame {frame} is not a declared mechanical.frames entry"
OCM_LOCATED_DOF_UNGOVERNED:
  phase: design
  outcome: refuse
  adr: ADR-0031
  layer: module
  # D3: every one of the six DOF must be governed exactly once. Ungoverned
  # and doubly-governed are the same failure -- a constraint scheme that
  # does not close -- and finding it in a manifest is cheaper than finding
  # it in steel.
  message: "located.constraints governs no feature for {dof} -- the constraint scheme does not close"
OCM_LOCATED_DOF_OVERCONSTRAINED:
  phase: design
  outcome: refuse
  adr: ADR-0031
  layer: module
  message: "{dof} is governed by both {feature_a} and {feature_b}"
OCM_LOCATED_TOLERANCE_MISSING:
  phase: design
  outcome: refuse
  adr: ADR-0031
  layer: module
  # A located pose without a tolerance is a claim of infinite precision.
  # Declared now, consumed later -- the numbers are known at authoring
  # time and unrecoverable after.
  message: "{feature} governs {dof} but declares no tolerance for it"
OCM_LOCATED_UNIT_MISMATCH:
  phase: design
  outcome: refuse
  adr: ADR-0031
  layer: module
  # ADR-0028 D2's rule applied to a second place: the unit is type-checked
  # against the DOF (length for x/y/z, angle for rx/ry/rz), never inferred
  # from it. A unit in NEITHER table is OCM_UNIT_UNRECOGNISED, unchanged.
  message: "Located feature {feature} gives {dof} a {kind} unit {unit}; a {dof_kind} DOF takes a {expected}"
