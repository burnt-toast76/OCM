# ===========================================================================
# DEFERRED VOCABULARY — named by an ADR, emitted by NO engine yet.
# `OCM_` namespace (ADR-0025 D4). Each carries `status: deferred` + `requires`.
# ===========================================================================

# --- Module connectivity, deferred until a component field is transcribed
#     (ADR-0015 D5, table 2) ------------------------------------------------
OCM_NET_TWO_DRIVERS:
  phase: design
  outcome: refuse
  adr: ADR-0015
  layer: module
  status: deferred
  requires: "component pin `direction`"
  message: "Net {net_id} has two driving pins"
OCM_NET_SIGNAL_CLASS_MISMATCH:
  phase: design
  outcome: refuse
  adr: ADR-0015
  layer: module
  status: deferred
  requires: "component pin signal class"
  message: "Net {net_id} joins endpoints of differing signal class"
OCM_PIN_REQUIRED_UNCONNECTED:
  phase: design
  outcome: refuse
  adr: ADR-0015
  layer: module
  status: deferred
  requires: "component pin `required`"
  message: "Required pin {pin} on {refdes} is left unconnected"
OCM_PNEUMATIC_PORT_MISMATCH:
  phase: design
  outcome: refuse
  adr: ADR-0015
  layer: module
  status: deferred
  requires: "component `pneumatic.ports[]` (function/thread)"
  message: "Pneumatic net {net_id} joins ports whose function/size disagree"
OCM_NET_OVERPRESSURE:
  phase: design
  outcome: refuse
  adr: ADR-0015
  layer: module
  status: deferred
  requires: "component `pressure_max` + `pneumatic.ports[]`"
  message: "Pneumatic net {net_id} pressure {p} exceeds endpoint {endpoint}'s rating"
OCM_COMMS_CHAIN_BROKEN:
  phase: design
  outcome: refuse
  adr: ADR-0015
  layer: module
  status: deferred
  requires: "component `comms.connectors[]` with `role`"
  message: "Communication chain {chain} does not resolve to a valid ordering"

# --- Cell interconnect (ADR-0019). Design-phase, but the cells/ schema has no
#     `ports` block yet, and ADR-0019 D5 deferred the line layer. -----------
OCM_HANDOFF_DIRECTION_MISMATCH:
  phase: design
  outcome: refuse
  adr: ADR-0019
  layer: cell
  status: deferred
  # ADR-0026 D4: direction is derived from the component pin, not declared at
  # the cell layer -- so this needs the same pin `direction` field OCM_NET_TWO_DRIVERS
  # names, on top of the cell schema. The cell schema alone will not light it up.
  requires: "cell manifest `ports` schema + component pin `direction`"
  message: "smema-downstream port {port} directions do not oppose the smema-upstream port it is netted to"
OCM_HANDOFF_SAME_ROLE:
  phase: design
  outcome: refuse
  adr: ADR-0019
  layer: cell
  status: deferred
  requires: "cell manifest `ports` schema"
  message: "Handoff net {net_id} joins two ports of the same role"
OCM_SAFETY_NET_UNRATED:
  phase: design
  outcome: refuse
  adr: ADR-0019
  layer: cell
  status: deferred
  requires: "cell manifest `ports` schema"
  message: "Safety-domain net {net_id} has an endpoint that is not a safety-rated component"
OCM_SIGNAL_NO_ACTIVE_STATE:
  phase: design
  outcome: refuse
  adr: ADR-0019
  layer: cell
  status: deferred
  # ADR-0026 D4: `active` is a property of a NET now, not a signal on a port.
  # The cells/ schema landed with `active` optional on a net (a purely internal
  # net legitimately has none), so this is NOT schema-enforceable -- it awaits
  # resolve logic that requires `active` on nets that cross the cell boundary
  # (an endpoint on a cell port).
  requires: "resolve logic over cell `nets` -- require `active` on boundary-crossing nets (schema landed, ADR-0026)"
  message: "Net {net_id} is declared without an active state"
OCM_HANDOFF_PORT_NO_IO:
  phase: design
  outcome: refuse
  adr: ADR-0019
  layer: cell
  status: deferred
  # ADR-0026 D4: a handoff pin resolving to real I/O carries a direction, which
  # is transcribed at the component layer -- so this needs pin `direction` too,
  # not just the cell schema.
  requires: "cell manifest `ports` schema + component pin `direction`"
  message: "Handoff port {port} pin does not resolve to real I/O on a transcribed component"

# --- A port is what a net can name (ADR-0026). Four of these five are enforced
#     STRUCTURALLY by the cells/ schema (additionalProperties:false + enums), so
#     they surface as OCM_SCHEMA_INVALID rather than as a separately-emitted
#     code -- marked below. One (net pin not exposed) is a resolve-time cross-
#     check into the contained modules. All stay deferred in this pass.
OCM_PORT_HAS_SIGNALS_LIST:
  phase: design
  outcome: refuse
  adr: ADR-0026
  layer: cell
  status: deferred
  requires: "STRUCTURAL -- cells/ schema additionalProperties:false on a port rejects the superseded ADR-0019 `signals[]`; surfaces as OCM_SCHEMA_INVALID"
  message: "Port {port} carries a nested signals list (the superseded ADR-0019 shape); handoff signals are pins named by nets"
OCM_PORT_DOMAIN_IDENTIFICATION:
  phase: design
  outcome: refuse
  adr: ADR-0026
  layer: cell
  status: deferred
  requires: "STRUCTURAL -- cells/ schema port `domain` enum omits 'identification'; surfaces as OCM_SCHEMA_INVALID"
  message: "Port {port} declares domain 'identification' (the superseded ADR-0020 shape); identity is a top-level block, not a port"
OCM_ACTIVE_NOT_ON_NET:
  phase: design
  outcome: refuse
  adr: ADR-0026
  layer: cell
  status: deferred
  requires: "STRUCTURAL -- cells/ schema puts `active` on a net only; a port/pin `active` is rejected by additionalProperties:false; surfaces as OCM_SCHEMA_INVALID"
  message: "`active` declared on port/pin {where} rather than on the net (ADR-0026 D4)"
OCM_DIRECTION_AT_CELL_LAYER:
  phase: design
  outcome: refuse
  adr: ADR-0026
  layer: cell
  status: deferred
  requires: "STRUCTURAL -- no `direction` field exists anywhere in the cells/ schema; additionalProperties:false rejects it; surfaces as OCM_SCHEMA_INVALID"
  message: "`direction` declared at the cell layer at {where}; direction is derived from the component pin (ADR-0026 D4), never declared here"
OCM_NET_PIN_NOT_EXPOSED:
  phase: design
  outcome: refuse
  adr: ADR-0026
  layer: cell
  status: deferred
  # Not structural: a resolve-time cross-check that the named cell-port pin is
  # exposed by a contained module port (ADR-0026 D3, reference-downward).
  requires: "cell manifest `ports` schema"
  message: "Net endpoint names cell port {port} pin {pin}, which no contained module port exposes"
OCM_LINK_ENDPOINT_NOT_A_PORT:
  phase: design
  outcome: refuse
  adr: ADR-0026
  layer: cell
  status: deferred
  requires: "STRUCTURAL -- ADR-0026 Erratum 1 removed the `sink` endpoint field; additionalProperties:false on the endpoint rejects any non-port reference; surfaces as OCM_SCHEMA_INVALID"
  message: "Link {link} endpoint names {what}, which is not a port; the record_sink is reached via record_sink.port, never named by a link (ADR-0026 Erratum 1)"

# --- Carrier identity (ADR-0020). Cycle-phase reads + line-scoped design. ---
# ADR-0020 Erratum 1 Correction A: the LOCAL disagreement (two channels the cell
# reads directly) stays refuse -- D4's no-tie-break rule, untouched.
OCM_IDENTITY_MISMATCH:
  phase: cycle
  outcome: refuse
  adr: ADR-0020
  layer: cell
  status: deferred
  requires: "cell `identity` port + runtime reader (part mark + carrier tag; no store)"
  message: "Carrier {carrier_id} tag unit_id disagrees with the part mark on the unit"
# ADR-0020 Erratum 1 Correction B: store disagreement OR an unreachable store
# degrades and records, so a store outage never stops the line (ADR-0021 D2).
OCM_IDENTITY_STORE_MISMATCH:
  phase: cycle
  outcome: degrade
  adr: ADR-0020
  layer: cell
  status: deferred
  requires: "cell `identity` port + runtime reader + record store (permitted unreachable, ADR-0021 D2)"
  records: store_binding_checked
  message: "Carrier {carrier_id} tag unit_id not confirmed against the store binding (disagreed, or store unreachable)"
OCM_CARRIER_STALE_BINDING:
  phase: cycle
  outcome: refuse
  adr: ADR-0020
  layer: cell
  status: deferred
  requires: "cell `carriers` fleet declaration + runtime carrier tracking"
  message: "Carrier {carrier_id} arrived at load with live binding {unit_id}"
# ADR-0020 Erratum 1 Correction C: refuse when the store ANSWERS 'scrap';
# degrade (recording scrap_disposition_checked=false) when the store is
# UNREACHABLE, so a store outage doesn't halt the line. Catalogued as the
# degrade outcome (the one that requires a recorded field); the message carries
# the refuse-when-answered half, which is not optional.
OCM_CARRIER_BOUND_TO_SCRAP:
  phase: cycle
  outcome: degrade
  adr: ADR-0020
  layer: cell
  status: deferred
  requires: "cell `carriers` declaration + record store (permitted unreachable, ADR-0021 D2)"
  records: scrap_disposition_checked
  message: "Carrier {carrier_id} bound to unit {unit_id}: REFUSE if the store answers 'scrap'; DEGRADE (records scrap_disposition_checked=false) if the store is unreachable"
OCM_TAG_READBACK_MISMATCH:
  phase: cycle
  outcome: refuse
  adr: ADR-0020
  layer: cell
  status: deferred
  requires: "cell `identity` port + runtime writer"
  message: "Tag write read-back mismatch on carrier {carrier_id}"
OCM_IDENTITY_PORT_MISSING:
  phase: design
  outcome: refuse
  adr: ADR-0020
  layer: cell
  status: deferred
  requires: "cell manifest `identity` port schema"
  message: "Cell in a traceability line has no identity port, or a reader that does not resolve to a transcribed component"
OCM_CARRIER_ENDURANCE_EXCEEDED:
  phase: design
  outcome: refuse
  adr: ADR-0020
  layer: line
  status: deferred
  requires: "the line layer (ADR-0019 D5 deferred it); a fleet cycle-count budget"
  message: "Carrier fleet {fleet}'s declared tag endurance cannot sustain the line's cycle count"
OCM_IDENTITY_DOUBLE_CREATION:
  phase: design
  outcome: refuse
  adr: ADR-0020
  layer: line
  status: deferred
  requires: "the line layer (ADR-0019 D5 deferred it)"
  message: "Two cells in one line both declare identity creation"

