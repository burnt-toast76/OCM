  phase: design
  outcome: refuse
  adr: ADR-0016
  layer: module
  message: "Manifest failed schema validation: {detail}"
DRAFT_NOT_PUBLISHABLE:
  phase: design
  outcome: refuse
  adr: ADR-0016
  layer: module
  message: "Draft {id} is not publishable: {reason}"
CELL_INVALID:
  phase: design
  outcome: refuse
  adr: ADR-0012
  layer: cell
  message: "Cell failed structural validation: {detail}"
NOT_FOUND:
  phase: design
  outcome: refuse
  adr: ADR-0012
  layer: api
  message: "No {kind} {id}"
ALREADY_EXISTS:
  phase: design
  outcome: refuse
  adr: ADR-0012
  layer: api
  message: "A {kind} {id} already exists"
INVALID_ARGUMENT:
  phase: design
  outcome: refuse
  adr: ADR-0012
  layer: api
  message: "{detail}"
HUMAN_SIGNATURE_REQUIRED:
  phase: design
  outcome: refuse
  adr: ADR-0012
  layer: cell
  message: "safety.verified_by is a human signature (spec/06); the API will not write it"

