# OCM refusal catalogue — the vocabulary is part of the standard (ADR-0025).
#
# One source of refusal rules; three phases evaluate it (ADR-0025 D1):
#   design — manifests only (ocm-resolve / validate_*)
#   load   — manifests + machine environment, once at start-up / state change
#   cycle  — live machine state, inside the cycle path (generated PLC/coordinator)
#
# outcome (ADR-0025 D3): refuse | degrade | advise.
#   A `degrade` entry MUST carry a `records:` field (the fact written on the
#   event so a later query can identify every affected unit). Enforced in CI.
#
# NAMING (ADR-0025 D4 says codes are namespaced `OCM_`). Two namespaces live
# here, deliberately, and the split is the honest state of the repo today:
#   * BARE codes (OCM_SCHEMA_INVALID, OCM_NET_TOO_FEW_ENDPOINTS, ...) are the codes
#     `ocm-resolve` / `ocm-api` ALREADY emit (see software/ocm-api/ocm_api/
#     envelope.py `Codes`). The task keeps the existing names rather than
#     inventing a parallel `OCM_`-prefixed scheme; the CI check matches emitted
#     strings against these keys verbatim.
#   * OCM_ codes are vocabulary an ADR names but NO engine emits yet. They are
#     `status: deferred` with a `requires:` note.
# The bare-vs-OCM_ discrepancy, and the migration it implies, is documented in
# docs/refusal-audit.md. Do not rename emitted codes in this doc-only pass.
#
# Fields per entry: phase, outcome, adr, layer, message; records (degrade only);
# status + requires (deferred only).

# ===========================================================================
# DESIGN PHASE — emitted today by ocm-core / ocm-resolve / ocm-api / generator
# ===========================================================================

