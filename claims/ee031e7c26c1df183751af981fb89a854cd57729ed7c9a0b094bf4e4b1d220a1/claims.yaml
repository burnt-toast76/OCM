# Real-document claims entry (ADR-0035): transcribed from the KEYENCE NEO
# Series General Catalog (LV NEO laser, FS NEO fiberoptic, PS NEO
# photoelectric, NU series communication units) via the extraction-preflight
# workflow -- all 68 pages preflighted, every hazard on a transcribed page
# resolved against the rendered page images (claims_preflight). The
# document's bytes are NOT in this repository (see claims/README.md); the
# hash was computed at ingest from the PDF itself. `date` is the printed
# copyright year, the only publication date the document prints; no source
# URL is recorded because the ingested copy carries none.
#
# Values are recorded in the metric units the document prints. The catalog
# states on p68 that "The specifications are expressed in metric units. The
# English units have been converted from the original metric units" -- the
# inch/ounce figures are the document's own conversions, not separate
# statements, and are not transcribed (same rule as the FS-N40 and LR-X
# entries).
#
# Glyph note (preflight): this document mixes the micro sign -- pp.17/42/57
# print U+03BC and p65 prints U+00B5. Each page is transcribed with the
# codepoint it prints; two response-time claims that read alike therefore
# differ in bytes, and in id, on purpose.
#
# A model printed with a bracketed connector suffix -- "PS-55 (C)",
# "PS-201 (C)", "PS-47 (C)" -- is enumerated as both variants (PS-55 +
# PS-55C); `family` keeps that judgment auditable (D1).
#
# PARTIAL PASS: no attestation -- an absent vocabulary key here means "not
# yet checked", not "the catalog is silent" (ADR-0035 D4).
#
# Transcribed: p16 sensor head specifications (eight LV head blocks + the
# LV-L01 lens attachment and its area example matrix); p17 LV amplifier
# units; p42 FS amplifier units + p43 M8 connector cable pin-wire colours;
# p56 PS thrubeam and reflective heads + options; p57 PS amplifier units;
# p61 common options; p64-p65 NU series communication units (NU-CL1, NU-DN1,
# NU-EP1, NU-EC1, NU-EN8N) and their option cables; p67 considerations (LV-H
# to LV-N head replacement map, LV-H Series amplifiers, connectable-amplifier
# counts, mutual-interference-prevention matrix).
#
# NOT transcribed: the FS NEO fiber-unit lineup tables (pp.28-41) -- the
# largest remaining block, ~100 fiber units with per-model detecting
# distance, fiber length, bend radius and temperature; every dimension-
# drawing page (pp.18-23, 44-53, 58-60, 66), so the `envelope` key is
# covered only where a spec table prints a case size (LV p17, FS p42,
# PS p57) and is uncovered for every sensor head and option; the LV lineup
# and feature pages (pp.6-15) and the FS/PS feature pages (pp.24-27, 54-55),
# whose spec content restates pp.16-17/42/56-57; and pp.1-5, 62-63, 68.
#
# Claim ids are computed by ocm_api.claims.claim_id -- never by hand.
# Records are append-only (D3/D7).
