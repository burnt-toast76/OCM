# Real-document claims entry (ADR-0035): transcribed from the KEYENCE
# LR-X Series (Compact Laser Sensor) catalog via the extraction-preflight
# workflow -- every page preflighted, every hazard resolved against the
# rendered page images (claims_preflight). The document's bytes are NOT in
# this repository (see claims/README.md); the hash was computed at ingest
# from the PDF itself. `date` is the printed copyright year, the only
# publication date the document prints; no source URL is recorded because
# the ingested copy carries none.
#
# Values are recorded in the metric units the document prints. The catalog
# states on p24 that "The specifications are expressed in metric units. The
# English units have been converted from the original metric units" -- the
# inch/ounce figures are the document's own conversions, not separate
# statements, and are not transcribed (same rule as the FS-N40 entry).
#
# PARTIAL PASS: no attestation -- an absent vocabulary key here means "not
# yet checked", not "the catalog is silent" (ADR-0035 D4). Transcribed so
# far: p17 Standard Models specifications + footnotes; p18 Sensor Head and
# Amplifier Unit specifications + footnotes; p15 STEP 1 (Required Functions
# matrix, Hi-Flex Robotic Cable Specifications, the lineup tables' NPN/PNP
# Output column -- the lineup's distance/spot/deviation/weight columns
# restate p17 and p18 verbatim, checked against the render, and are not
# re-recorded at their p15 locator); p16 STEP 2/STEP 3 accessories; p10-p11
# feature and limit statements; p23 wiring devices; p24 LR family detecting
# distances. NOT transcribed: the dimension drawings on pp.19-22 (so the
# `envelope` key is uncovered for every model), the p15 Enclosure Rating
# cells for the separate-amplifier columns (their "Sensor Unit" is the
# sensor head, whose IP rating p18 records under the head's own part
# numbers -- filing them under an amplifier model would say the amplifier
# is rated, which the same table denies), and pp.1-9, 12-14, 19-22 generally.
#
# Claim ids are computed by ocm_api.claims.claim_id -- never by hand.
# Records are append-only (D3/D7).
